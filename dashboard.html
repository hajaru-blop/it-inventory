<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal - Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #eef2f6 0%, #ffefe8 50%, #e2e8f0 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border-radius: 1.25rem;
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(209, 213, 219, 0.6);
      border-radius: 0.75rem;
    }

    .glass-btn-orange {
      background: rgba(255, 107, 44, 0.95);
      backdrop-filter: blur(4px);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(255, 107, 44, 0.3);
      transition: all 0.2s ease;
    }
    .glass-btn-orange:hover { background: #ff6b2c; }

    .glass-btn-black {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(4px);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(17, 24, 39, 0.2);
      transition: all 0.2s ease;
    }
    .glass-btn-black:hover { background: #111827; }
  </style>
</head>
<body class="min-h-screen text-black flex relative overflow-x-hidden">

  <!-- Ambient Glow Effects -->
  <div class="fixed top-10 left-64 w-96 h-96 bg-[#ff6b2c]/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-10 right-10 w-96 h-96 bg-slate-400/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- GLASS SIDEBAR -->
  <aside class="w-64 p-6 flex flex-col justify-between min-h-screen fixed inset-y-0 left-0 z-50 glass-card rounded-none rounded-r-3xl border-l-0">
    <div class="space-y-8">
      <div class="px-2 space-y-3">
        <img src="logo.png" alt="Reservoir Link Logo" class="h-10 object-contain">
        <div class="flex items-center gap-2">
          <div class="bg-[#ff6b2c] text-white font-extrabold px-2.5 py-1 rounded-lg text-xs shadow-md">IT</div>
          <span class="font-extrabold text-black text-lg tracking-wide">Portal System</span>
        </div>
      </div>
      <nav class="space-y-3">
        <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-xl glass-btn-orange font-extrabold text-xs uppercase tracking-wider">
          Dashboard
        </a>
        <a href="inventory.html" class="flex items-center px-4 py-3 rounded-xl text-slate-700 hover:text-black font-extrabold text-xs uppercase tracking-wider transition hover:bg-white/40">
          Inventory List
        </a>
      </nav>
    </div>
    <div class="space-y-4 pt-4 border-t border-slate-300/60">
      <div class="px-2">
        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-widest">Logged In As</p>
        <p id="user-display" class="text-xs text-black font-extrabold truncate mt-1">Loading...</p>
      </div>
      <button onclick="handleSignOut()" class="w-full glass-btn-black font-extrabold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider text-center">
        Sign Out
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 ml-64 p-8 space-y-8 z-10">
    <!-- TOP FILTER BAR -->
    <div class="glass-card p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-6">
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2 tracking-wider">Brand</label>
          <select id="filter-brand" onchange="applyFilters()" class="glass-input px-4 py-2 text-xs font-extrabold text-black outline-none min-w-[140px]">
            <option value="All">All</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2 tracking-wider">Workbase</label>
          <select id="filter-workbase" onchange="applyFilters()" class="glass-input px-4 py-2 text-xs font-extrabold text-black outline-none min-w-[140px]">
            <option value="All">All</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2 tracking-wider">Status</label>
          <select id="filter-status" onchange="applyFilters()" class="glass-input px-4 py-2 text-xs font-extrabold text-black outline-none min-w-[140px]">
            <option value="All">All</option>
          </select>
        </div>
      </div>
      <button onclick="resetFilters()" class="glass-btn-black text-xs font-extrabold px-5 py-2.5 rounded-xl uppercase tracking-wider">
        Reset filters
      </button>
    </div>

    <!-- KPI CARDS GRID -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <div class="glass-card p-6 flex flex-col justify-between">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Total Assets</span>
        <span id="kpi-total" class="text-5xl font-black text-black mt-3">0</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between border-l-8 border-l-[#ff6b2c]">
        <span class="text-xs font-extrabold uppercase tracking-wider text-[#ff6b2c]">In Stock</span>
        <span id="kpi-stock" class="text-5xl font-black text-black mt-3">0</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between border-l-8 border-l-emerald-500">
        <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-600">In Use</span>
        <span id="kpi-use" class="text-5xl font-black text-black mt-3">0</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between border-l-8 border-l-slate-800">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-800">Repair</span>
        <span id="kpi-repair" class="text-5xl font-black text-black mt-3">0</span>
      </div>
    </div>

    <!-- CHARTS GRID -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div class="glass-card p-6">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-4">Count of ID by Workbase</h2>
        <div class="h-64 relative">
          <canvas id="chart-workbase"></canvas>
        </div>
      </div>

      <div class="glass-card p-6">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-4">Count of ID by Status</h2>
        <div class="h-64 relative">
          <canvas id="chart-status"></canvas>
        </div>
      </div>

      <div class="glass-card p-6">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-4">Count of ID by Company</h2>
        <div class="h-64 relative">
          <canvas id="chart-company"></canvas>
        </div>
      </div>

      <div class="glass-card p-6 md:col-span-3">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-4">Count of ID by Brand</h2>
        <div class="h-64 relative">
          <canvas id="chart-brand"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
