<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="inline-block bg-blue-600 text-white font-bold px-4 py-2 rounded-lg mb-2">IT INVENTORY</div>
      <h1 class="text-2xl font-bold text-slate-800">Company Portal</h1>
      <p class="text-sm text-slate-500">Sign in to manage equipment and records</p>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="w-full px-4 py-2 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <!-- EYE TOGGLE BUTTON -->
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="text-xs text-slate-400 mt-1">Min 8 chars: 1 uppercase, 1 lowercase, 1 number, 1 symbol.</p>
      </div>

      <div id="auth-error" class="hidden p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg"></div>

      <div class="flex gap-3 pt-2">
        <button type="submit" onclick="authMode='login'" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Sign In</button>
        <button type="submit" onclick="authMode='signup'" class="w-1/2 bg-slate-600 hover:bg-slate-700 text-white font-medium py-2 rounded-lg transition">Register</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script>
    let authMode = 'login';
    // Accepts 8+ chars with uppercase, lowercase, number, and any special character
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Crossed Eye Icon
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.038 10.038 0 013.682-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-3.111-2.11a3 3 0 11-4.243-4.243" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />`;
      } else {
        passwordInput.type = 'password';
        // Normal Eye Icon
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('auth-error');
      errorDiv.classList.add('hidden');

      if (!passwordRegex.test(password)) {
        errorDiv.innerText = "Password must contain 8+ characters with uppercase, lowercase, number, and symbol.";
        errorDiv.classList.remove('hidden');
        return;
      }

      const { error } = (authMode === 'login') 
        ? await supabaseClient.auth.signInWithPassword({ email, password })
        : await supabaseClient.auth.signUp({ email, password });

      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
