<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #eef2f6; }
    .neu-card {
      background: #eef2f6;
      box-shadow: 12px 12px 24px #cbd2db, -12px -12px 24px #ffffff;
      border-radius: 1.5rem;
    }
    .neu-input {
      background: #eef2f6;
      box-shadow: inset 4px 4px 8px #cbd2db, inset -4px -4px 8px #ffffff;
      border-radius: 0.75rem;
    }
    .neu-btn-orange {
      background: #ff6b2c;
      box-shadow: 5px 5px 12px #d4521f, -3px -3px 8px #ffffff;
      transition: all 0.2s ease;
    }
    .neu-btn-orange:hover { background: #e55a1f; }
    .neu-btn-black {
      background: #111827;
      box-shadow: 5px 5px 12px #cbd2db, -3px -3px 8px #ffffff;
      transition: all 0.2s ease;
    }
    .neu-btn-black:hover { background: #1f2937; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 font-sans text-slate-900">

  <div class="neu-card p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-block bg-[#ff6b2c] text-white font-extrabold px-5 py-2.5 rounded-xl text-sm shadow-md tracking-wider uppercase mb-3">
        IT Inventory
      </div>
      <h1 class="text-3xl font-black text-black tracking-tight">Company Portal</h1>
      <p class="text-xs font-semibold text-slate-500 mt-1 uppercase tracking-widest">Sign in to manage equipment</p>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-extrabold text-black uppercase mb-2 tracking-wider">Email Address</label>
        <input type="email" id="email" required class="neu-input w-full px-4 py-3 outline-none text-black text-sm font-medium">
      </div>

      <div>
        <label class="block text-xs font-extrabold text-black uppercase mb-2 tracking-wider">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="neu-input w-full px-4 py-3 pr-12 outline-none text-black text-sm font-medium">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-black">
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-2 font-medium">Min 8 chars: 1 uppercase, 1 lowercase, 1 number, 1 symbol.</p>
      </div>

      <div id="auth-error" class="hidden p-3 neu-input text-red-600 text-xs font-bold"></div>

      <div class="flex gap-4 pt-3">
        <button type="submit" onclick="authMode='login'" class="w-1/2 neu-btn-orange text-white font-bold py-3 rounded-xl uppercase text-xs tracking-wider">Sign In</button>
        <button type="submit" onclick="authMode='signup'" class="w-1/2 neu-btn-black text-white font-bold py-3 rounded-xl uppercase text-xs tracking-wider">Register</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script>
    let authMode = 'login';
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.038 10.038 0 013.682-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-3.111-2.11a3 3 0 11-4.243-4.243" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />`;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('auth-error');
      errorDiv.classList.add('hidden');

      if (!passwordRegex.test(password)) {
        errorDiv.innerText = "Password must contain 8+ characters with uppercase, lowercase, number, and symbol.";
        errorDiv.classList.remove('hidden');
        return;
      }

      const { error } = (authMode === 'login') 
        ? await supabaseClient.auth.signInWithPassword({ email, password })
        : await supabaseClient.auth.signUp({ email, password });

      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
