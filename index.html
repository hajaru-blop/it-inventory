<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portal - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #eef2f6 0%, #ffefe8 50%, #e2e8f0 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      border-radius: 1.5rem;
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(209, 213, 219, 0.6);
      border-radius: 0.75rem;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.85);
      border-color: #ff6b2c;
    }

    .glass-btn-orange {
      background: rgba(255, 107, 44, 0.95);
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 20px rgba(255, 107, 44, 0.3);
      transition: all 0.2s ease;
    }
    .glass-btn-orange:hover {
      background: #ff6b2c;
      transform: translateY(-1px);
    }

    .glass-btn-black {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.2);
      transition: all 0.2s ease;
    }
    .glass-btn-black:hover {
      background: #111827;
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-900 relative overflow-hidden">

  <!-- Ambient Glowing Glass Accents -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#ff6b2c]/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-slate-400/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass-card p-8 w-full max-w-md z-10">
    <div class="text-center mb-8">
      <img src="logo.png" alt="Reservoir Link Logo" class="h-14 mx-auto mb-4 object-contain">
      <div class="inline-block bg-[#ff6b2c] text-white font-extrabold px-5 py-2 rounded-xl text-xs tracking-wider uppercase mb-3 shadow-md">
        IT Inventory
      </div>
      <h1 class="text-3xl font-extrabold text-black tracking-tight">Company Portal</h1>
      <p class="text-xs font-bold text-slate-500 mt-1 uppercase tracking-widest">Sign in to manage equipment</p>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-extrabold text-black uppercase mb-2 tracking-wider">Email Address</label>
        <input type="email" id="email" required class="glass-input w-full px-4 py-3 outline-none text-black text-sm font-semibold">
      </div>

      <div>
        <label class="block text-xs font-extrabold text-black uppercase mb-2 tracking-wider">Password</label>
        <div class="relative">
          <input type="password" id="password" required class="glass-input w-full px-4 py-3 pr-12 outline-none text-black text-sm font-semibold">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-black">
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="text-[11px] text-slate-500 mt-2 font-semibold">Min 8 chars: 1 uppercase, 1 lowercase, 1 number, 1 symbol.</p>
      </div>

      <div id="auth-error" class="hidden p-3 glass-input text-red-600 text-xs font-extrabold"></div>

      <div class="flex gap-4 pt-3">
        <button type="submit" onclick="authMode='login'" class="w-1/2 glass-btn-orange text-white font-extrabold py-3 rounded-xl uppercase text-xs tracking-wider">Sign In</button>
        <button type="submit" onclick="authMode='signup'" class="w-1/2 glass-btn-black text-white font-extrabold py-3 rounded-xl uppercase text-xs tracking-wider">Register</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script>
    let authMode = 'login';
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.038 10.038 0 013.682-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-3.111-2.11a3 3 0 11-4.243-4.243" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />`;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('auth-error');
      errorDiv.classList.add('hidden');

      if (!passwordRegex.test(password)) {
        errorDiv.innerText = "Password must contain 8+ characters with uppercase, lowercase, number, and symbol.";
        errorDiv.classList.remove('hidden');
        return;
      }

      const { error } = (authMode === 'login') 
        ? await supabaseClient.auth.signInWithPassword({ email, password })
        : await supabaseClient.auth.signUp({ email, password });

      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
